!include ../shared/verification-defaults.yaml
plugin: verification
case_directory: "${verification.cases}"
working_directory: "${verification.workdir}"
runs: 1
command: [python3, -u, "${verification.script}", --case, "${case}", --seed, "${seed}", --compile-log, "${verification.artifacts}/${case}.compile.log", --run-log, "${verification.artifacts}/${case}.run.log"]
labels: [example, verification]
compile_logs: ["${verification.artifacts}/${case}.compile.log"]
run_logs: ["${verification.artifacts}/${case}.run.log"]
