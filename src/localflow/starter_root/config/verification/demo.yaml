# Case and seed are substituted only where this command explicitly references them.
plugin: verification
case_names: [case-a, case-b, smoke]
working_directory: .
command: >-
  make all CASE=${case} SEED=${seed}
labels: [verification]
compile_logs: ["artifacts/${case}.compile.log"]
run_logs: ["artifacts/${case}.run.log"]
custom_texts:
  - "Case: ${case}"
  - "Seed: ${seed}"
