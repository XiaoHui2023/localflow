!include ../shared/task-defaults.yaml
plugin: verification
case_directory: "${cases_dir}"
runs: 1
command: [python3, -u, "${scripts_dir}/simulate.py", --case, "${case}", --seed, "${seed}", --compile-log, "${root}/artifacts/${case}.compile.log", --run-log, "${root}/artifacts/${case}.run.log"]
labels: [example, verification]
compile_logs: ["${root}/artifacts/${case}.compile.log"]
run_logs: ["${root}/artifacts/${case}.run.log"]
