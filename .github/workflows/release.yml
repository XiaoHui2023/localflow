name: Rolling static release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build offline frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run source quality gates
        run: |
          python3 -m pip install '.[dev]'
          ruff check src/localflow tests_v2 tests_target tools/check_quality.py tools/run_browser_quality.py tools/run_frozen_smoke.py
          pytest
          python tools/check_quality.py
          npm --prefix frontend audit
      - name: Build static executable on glibc 2.23 baseline
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work ubuntu:16.04 \
            bash tools/ci_pack_ubuntu16.sh
      - name: Finalize staticx with current binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python3 -m venv .venv-staticx
          .venv-staticx/bin/pip install 'staticx>=0.14,<1'
          PACK_STATICX="$PWD/.venv-staticx/bin/staticx" \
            ./tools/finalize_release.sh dist/localflow.pyinstaller
      - name: Smoke final static executable
        run: python3 tools/run_frozen_smoke.py --binary dist/localflow
      - name: Smoke freshly extracted archive
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          extract_dir="$(mktemp -d)"
          tar -xzf "dist/localflow-${version}-linux-x86_64.tar.gz" -C "$extract_dir"
          python3 tools/run_frozen_smoke.py --binary "$extract_dir/localflow-${version}-linux-x86_64/localflow"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/localflow
            dist/localflow-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Resolve rolling tag
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Move version tag to this verified commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LocalFlow ${{ steps.version.outputs.tag }}
          body: |
            Rolling static release built from `${{ github.sha }}`.

            `localflow` is the directly executable Linux x86_64 staticx artifact. The archive also contains the systemd deployment files. Verify downloads with `SHA256SUMS`.
          prerelease: false
          make_latest: true
          files: |
            dist/localflow
            dist/localflow-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
