name: Rolling static release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build offline frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run source quality gates
        run: |
          python3 -m pip install '.[dev]'
          ruff check src/localflow tests_v2 tests_target tools/check_quality.py tools/run_browser_quality.py tools/run_linux_browser_quality.py tools/run_frozen_smoke.py
          pytest
          python tools/check_quality.py
          npm --prefix frontend audit
      - name: Run Ubuntu systemd, PTY and cgroup quality gates
        run: |
          image="localflow-systemd-test:${GITHUB_RUN_ID}"
          container="localflow-systemd-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build -f tests_target/Dockerfile.systemd -t "$image" .
          docker run --privileged --cgroupns=host --name "$container" -d \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/work" "$image"
          for attempt in $(seq 1 60); do
            state="$(docker exec "$container" systemctl is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            test "$attempt" -lt 60 || {
              docker logs "$container"
              docker exec "$container" systemctl --failed --no-pager || true
              exit 1
            }
            sleep 1
          done
          docker exec "$container" bash -lc '
            useradd --system --create-home --shell /bin/bash localflow
            loginctl enable-linger localflow
            uid="$(id -u localflow)"
            systemctl start "user@${uid}.service"
            python3 -m venv /opt/localflow/venv
            /opt/localflow/venv/bin/pip install -e "/work[dev]"
          '
          uid="$(docker exec "$container" id -u localflow | tr -d '\r')"
          docker exec "$container" runuser -u localflow -- \
            env XDG_RUNTIME_DIR="/run/user/${uid}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus" \
            /opt/localflow/venv/bin/pytest -q \
            /work/tests_v2 /work/tests_target/test_localflow_systemd_executor.py \
            /work/tests_target/test_secret_permissions.py
      - name: Build complete static executable on glibc 2.23 baseline
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work ubuntu:16.04 \
            bash tools/ci_pack_ubuntu16.sh
      - name: Verify final executable on legacy x86-64 CPU models
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          ./tools/check_linux_compatibility.sh dist/localflow
      - name: Smoke final static executable
        run: python3 tools/run_frozen_smoke.py --binary dist/localflow
      - name: Smoke freshly extracted archive
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          extract_dir="$(mktemp -d)"
          tar -xzf "dist/localflow-${version}-linux-x86_64.tar.gz" -C "$extract_dir"
          bundle="$extract_dir/localflow-${version}-linux-x86_64"
          test -f "$bundle/config.yaml"
          test -f "$bundle/config/command/hello-world.yaml"
          test -f "$bundle/config/verification/demo.yaml"
          test -f "$bundle/plugins/command.py"
          test -f "$bundle/plugins/verification.py"
          test -f "$bundle/plugins/README.md"
          test -x "$bundle/stop-localflow.sh"
          test -f "$bundle/docs/api.md"
          test -f "$bundle/docs/configuration.md"
          test -f "$bundle/docs/plugins.md"
          test -f "$bundle/skills/localflow-project/SKILL.md"
          test -f "$bundle/skills/localflow-api/SKILL.md"
          test -f "$bundle/skills/localflow-configuration/SKILL.md"
          test -f "$bundle/skills/localflow-plugin-development/SKILL.md"
          test -f "$bundle/skills/localflow-operations/SKILL.md"
          test "$(stat -c '%a' "$bundle")" = 750
          test "$(stat -c '%a' "$bundle/config")" = 750
          test "$(stat -c '%a' "$bundle/secrets")" = 700
          test "$(stat -c '%a' "$bundle/runtime")" = 750
          test "$(stat -c '%a' "$bundle/runtime/instances")" = 750
          test -x "$bundle/scripts/simulate.py"
          test ! -e "$bundle/plugins/marker.py"
          test ! -e "$bundle/plugins/interactive.py"
          test ! -e "$bundle/plugins/declarative.py"
          test ! -e "$bundle/scripts/marker_result.py"
          test ! -e "$bundle/scripts/interactive_shutdown.py"
          (cd "$bundle" && /bin/sh -c "printf 'hello world\\n' > hello-world.txt")
          test "$(cat "$bundle/hello-world.txt")" = "hello world"
          python3 tools/run_frozen_smoke.py --binary "$bundle/localflow" --bundle-root "$bundle"
      - name: Install Ubuntu Chrome and Firefox for release UI gate
        run: npm --prefix frontend exec -- playwright install --with-deps chrome firefox
      - name: Run Chrome and Firefox against final release executable
        run: python3 tools/run_linux_browser_quality.py --binary dist/localflow
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-browser-evidence
          path: quality/evidence/browser-linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/localflow
            dist/localflow-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Resolve rolling tag
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Move version tag to this verified commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LocalFlow ${{ steps.version.outputs.tag }}
          body: |
            Rolling static release built from `${{ github.sha }}`.

            `localflow` is the directly executable Linux x86_64 staticx artifact. The archive also contains the systemd deployment files. Verify downloads with `SHA256SUMS`.
          prerelease: false
          make_latest: true
          files: |
            dist/localflow
            dist/localflow-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
